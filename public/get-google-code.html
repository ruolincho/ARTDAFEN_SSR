<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Authorize</title>
</head>
<body>
<script>
    var GGC = {
        urlParams: {},
        getUrlParams: function () {
            var pairs = location.search.substring(1).split('&');
            for (var i = 0; i < pairs.length; i++) {
                var pos = pairs[i].indexOf('=');
                if (pos === -1) continue;
                GGC.urlParams[pairs[i].substring(0, pos)] = decodeURIComponent(pairs[i].substring(pos + 1));
            }
        },
        appendParams: function (url, params) {
            if (params) {
                var baseWithSearch = url.split('#')[0];
                var hash = url.split('#')[1];
                for (var key in params) {
                    var attrValue = params[key];
                    if (attrValue !== undefined) {
                        var newParam = key + "=" + attrValue;
                        if (baseWithSearch.indexOf('?') > 0) {
                            baseWithSearch += "&" + newParam;
                        } else {
                            baseWithSearch += "?" + newParam;
                        }
                    }
                }
                if (hash) {
                    url = baseWithSearch + '#' + hash;
                } else {
                    url = baseWithSearch;
                }
            }
            return url;
        },
        doRedirect: function () {
            var code = GGC.urlParams['code'];
            var state = GGC.urlParams['state']; // 真实业务地址

            if (code && state) {
                var targetUrl = GGC.appendParams(state, {
                    code: code,
                    state: encodeURIComponent(state)
                });
                location.href = targetUrl;
            } else {
                document.body.innerHTML = '<h3>Missing necessary parameters, unable to complete the jump.</h3>';
            }
        }
    };

    GGC.getUrlParams();
    GGC.doRedirect();
</script>
</body>
</html>
